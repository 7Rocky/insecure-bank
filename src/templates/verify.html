{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto bg-white p-6 rounded shadow mt-10">
  <h2 class="text-2xl font-bold mb-4">Verificar usuarios</h2>
  {% if users %}
    <ul class="space-y-4">
    {% for user in users %}
      <li class="border-b pb-4">
        <a href="{{ url_for('profile', username=user.username) }}" class="text-blue-700 font-semibold hover:underline">{{ user.username }}</a>
        <p class="text-gray-700">{{ user.bio | safe }}</p>
        <div class="flex gap-2 mt-2">
          <a href="/admin/verify?verify=true&username={{ user.username }}" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700 transition hover:text-white" name="verify">Verificar</a>
          <a href="/admin/verify?verify=false&username={{ user.username }}" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700 transition hover:text-white" name="reject">Rechazar</a>
        </div>
      </li>
    {% endfor %}
    </ul>
  {% else %}
    <p class="text-gray-700">No se encontraron resultados.</p>
  {% endif %}
</div>
{% endblock %}
